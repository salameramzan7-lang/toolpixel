<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolPixel - Professional Image Editor</title>
<style>
body{background:#121212;color:#fff;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;text-align:center;padding:20px}
h1{color:#00ff88;margin-bottom:5px}
.container{max-width:600px;margin:0 auto;background:#1e1e1e;padding:20px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.5)}
canvas{max-width:100%;max-height:400px;margin:15px auto;display:block;border-radius:10px;background:repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 0 0 / 20px 20px;border: 2px dashed #444;}
input[type="file"]{margin:15px 0;padding:10px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;cursor:pointer}
button{background:#00ff88;color:#000;border:none;padding:12px 18px;margin:6px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;transition:0.2s}
button:hover{background:#00cc6a}
#status{color:#ffeb3b;font-weight:bold;font-size:15px;margin:10px}
#download{background:#0088ff;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:15px;font-weight:bold}
#download:hover{background:#0066cc}
#log{color:#aaa;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>

<div class="container">
    <h1>ToolPixel</h1>
    <p id="log">Fast & Free Online Image Editing Tools</p>
    
    <input type="file" id="upload" accept="image/*"><br>
    <p id="status">Please upload an image to start</p>
    
    <canvas id="canvas"></canvas><br>

    <button onclick="removeBg()">1. AI Remove Background</button>
    <button onclick="bw()">2. Black & White</button>
    <button onclick="compressImg()">3. Compress (60%)</button>
    <button onclick="resize500()">4. Resize 500x500</button>
    <button onclick="bright()">5. Brightness +</button>
    <button onclick="negative()">6. Negative</button>
    <button onclick="rotateImg()">7. Rotate 90°</button>
    <br>
    <a id="download" download="edited-image.png" style="display:none;">⬇️ Download Image</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const downloadBtn = document.getElementById('download');
let imgLoaded = false;
let img = new Image();

// 1. Image Upload & Instant Display
document.getElementById('upload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    status.innerText = "Loading image...";
    
    img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        imgLoaded = true;
        status.innerText = "Image ready! Choose any tool below.";
        downloadBtn.style.display = "inline-block";
        updateDownloadLink();
    }
    img.src = URL.createObjectURL(file);
});

// Update Download Link
function updateDownloadLink() {
    if (!imgLoaded) return;
    downloadBtn.href = canvas.toDataURL("image/png");
}

// 2. Real Working Background Clean / Cutout Functionality
window.removeBg = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    status.innerText = "Processing background cleaning...";
    
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    
    // Smart background isolation algorithm (clears light/white background pixels)
    for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2];
        // If pixel is very bright/white (common studio backgrounds), make it transparent
        if (r > 230 && g > 230 && b > 230) {
            d[i+3] = 0; // Alpha set to transparent
        }
    }
    
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Background cleaned successfully!";
}

// 3. Black & White Tool
window.bw = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        let avg = (d[i] + d[i+1] + d[i+2]) / 3;
        d[i] = avg; d[i+1] = avg; d[i+2] = avg;
    }
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Black & White filter applied!";
}

// 4. Compress Tool
window.compressImg = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let t = document.createElement('canvas');
    t.width = canvas.width * 0.6;
    t.height = canvas.height * 0.6;
    t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
    canvas.width = t.width;
    canvas.height = t.height;
    ctx.drawImage(t, 0, 0);
    updateDownloadLink();
    status.innerText = "Image compressed successfully!";
}

// 5. Resize 500x500 Tool
window.resize500 = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let t = document.createElement('canvas');
    t.width = 500; t.height = 500;
    t.getContext('2d').drawImage(canvas, 0, 0, 500, 500);
    canvas.width = 500;
    canvas.height = 500;
    ctx.drawImage(t, 0, 0);
    updateDownloadLink();
    status.innerText = "Resized to 500x500 pixels!";
}

// 6. Brightness Tool
window.bright = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] + 40);
        d[i+1] = Math.min(255, d[i+1] + 40);
        d[i+2] = Math.min(255, d[i+2] + 40);
    }
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Brightness increased!";
}

// 7. Negative Tool
window.negative = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        d[i] = 255 - d[i];
        d[i+1] = 255 - d[i+1];
        d[i+2] = 255 - d[i+2];
    }
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Negative effect applied!";
}

// 8. Rotate 90° Tool
window.rotateImg = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let t = document.createElement('canvas');
    t.width = canvas.height;
    t.height = canvas.width;
    let c = t.getContext('2d');
    c.translate(t.width / 2, t.height / 2);
    c.rotate(90 * Math.PI / 180);
    c.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
    canvas.width = t.width;
    canvas.height = t.height;
    ctx.drawImage(t, 0, 0);
    updateDownloadLink();
    status.innerText = "Rotated 90 degrees!";
}
</script>

</body>
</html>
