<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolPixel - Professional Image Editor</title>
<style>
body{background:#121212;color:#fff;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;text-align:center;padding:20px}
h1{color:#00ff88;margin-bottom:5px}
.container{max-width:600px;margin:0 auto;background:#1e1e1e;padding:20px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.5)}
canvas{max-width:100%;max-height:400px;margin:15px auto;display:block;border-radius:10px;background:repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 0 0 / 20px 20px;border: 2px dashed #444;}
input[type="file"]{margin:15px 0;padding:10px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;cursor:pointer}
button{background:#00ff88;color:#000;border:none;padding:12px 18px;margin:6px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;transition:0.2s}
button:hover{background:#00cc6a}
button:disabled{background:#555;color:#888;cursor:not-allowed}
#status{color:#ffeb3b;font-weight:bold;font-size:15px;margin:10px}
#download{background:#0088ff;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:15px;font-weight:bold}
#download:hover{background:#0066cc}
#log{color:#aaa;font-size:12px;margin-bottom:10px}
</style>
<!-- Load Real Background Removal Library from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>
</head>
<body>

<div class="container">
    <h1>ToolPixel</h1>
    <p id="log">Professional AI & Standard Image Studio</p>
    
    <input type="file" id="upload" accept="image/*"><br>
    <p id="status">Please upload an image to start</p>
    
    <canvas id="canvas"></canvas><br>

    <button id="bgBtn" onclick="removeBackgroundAI()">1. AI Remove Background</button>
    <button onclick="applyBW()">2. Black & White</button>
    <button onclick="applyCompress()">3. Compress (60%)</button>
    <button onclick="applyResize500()">4. Resize 500x500</button>
    <button onclick="applyBrightness()">5. Brightness +</button>
    <button onclick="applyNegative()">6. Negative</button>
    <button onclick="applyRotate90()">7. Rotate 90°</button>
    <br>
    <a id="download" download="transparent-image.png" style="display:none;">⬇️ Download Image</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const log = document.getElementById('log');
const downloadBtn = document.getElementById('download');
const bgBtn = document.getElementById('bgBtn');
let imgLoaded = false;
let currentFile = null;
let img = new Image();

// 1. Image Upload & Display Handler
document.getElementById('upload').addEventListener('change', function(e) {
    currentFile = e.target.files[0];
    if (!currentFile) return;

    status.innerText = "Loading image into canvas...";
    
    img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        imgLoaded = true;
        status.innerText = "Image ready! Select any tool below.";
        log.innerText = "Dimensions: " + img.width + "x" + img.height;
        downloadBtn.style.display = "inline-block";
        updateDownloadLink();
    }
    img.src = URL.createObjectURL(currentFile);
});

// Update Download Link
function updateDownloadLink() {
    if (!imgLoaded) return;
    downloadBtn.href = canvas.toDataURL("image/png");
}

// 2. Real AI Background Removal (Corrected function call)
window.removeBackgroundAI = async function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    
    bgBtn.disabled = true;
    status.innerText = "AI is downloading model & removing background (Please wait 10-20s)...";
    log.innerText = "Processing via AI engine...";

    try {
        // Correct global function name from the bundle
        const imageBlob = await window.removeBackground(currentFile);
        
        const reader = new FileReader();
        reader.onload = function(e) {
            let resultImg = new Image();
            resultImg.onload = function() {
                canvas.width = resultImg.width;
                canvas.height = resultImg.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(resultImg, 0, 0);
                updateDownloadLink();
                status.innerText = "Background Removed Successfully!";
                log.innerText = "Transparent PNG ready.";
                bgBtn.disabled = false;
            }
            resultImg.src = e.target.result;
        }
        reader.readAsDataURL(imageBlob);

    } catch (err) {
        status.innerText = "Error in AI processing.";
        log.innerText = err.message;
        bgBtn.disabled = false;
    }
}

// 3. Black & White Tool
window.applyBW = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        let avg = 0.3 * d[i] + 0.59 * d[i+1] + 0.11 * d[i+2];
        d[i] = avg; d[i+1] = avg; d[i+2] = avg;
    }
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Black & White filter applied!";
}

// 4. Compress Tool
window.applyCompress = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let t = document.createElement('canvas');
    t.width = Math.floor(canvas.width * 0.6);
    t.height = Math.floor(canvas.height * 0.6);
    t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
    canvas.width = t.width;
    canvas.height = t.height;
    ctx.drawImage(t, 0, 0);
    updateDownloadLink();
    status.innerText = "Image compressed by 40%!";
    log.innerText = "New size: " + canvas.width + "x" + canvas.height;
}

// 5. Resize 500x500 Tool
window.applyResize500 = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let t = document.createElement('canvas');
    t.width = 500; t.height = 500;
    t.getContext('2d').drawImage(canvas, 0, 0, 500, 500);
    canvas.width = 500;
    canvas.height = 500;
    ctx.drawImage(t, 0, 0);
    updateDownloadLink();
    status.innerText = "Resized to exact 500x500 pixels!";
    log.innerText = "Dimensions: 500x500";
}

// 6. Brightness Tool
window.applyBrightness = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] + 45);
        d[i+1] = Math.min(255, d[i+1] + 45);
        d[i+2] = Math.min(255, d[i+2] + 45);
    }
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Brightness increased successfully!";
}

// 7. Negative Tool
window.applyNegative = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        d[i] = 255 - d[i];
        d[i+1] = 255 - d[i+1];
        d[i+2] = 255 - d[i+2];
    }
    ctx.putImageData(imgData, 0, 0);
    updateDownloadLink();
    status.innerText = "Negative effect applied!";
}

// 8. Rotate 90° Tool
window.applyRotate90 = function() {
    if (!imgLoaded) return alert("Please upload an image first!");
    let t = document.createElement('canvas');
    t.width = canvas.height;
    t.height = canvas.width;
    let c = t.getContext('2d');
    c.translate(t.width / 2, t.height / 2);
    c.rotate(90 * Math.PI / 180);
    c.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
    canvas.width = t.width;
    canvas.height = t.height;
    ctx.drawImage(t, 0, 0);
    updateDownloadLink();
    status.innerText = "Rotated 90 degrees clockwise!";
    log.innerText = "New dimensions: " + canvas.width + "x" + canvas.height;
}
</script>

</body>
</html>
