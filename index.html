<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolPixel - 7 Offline Tools</title>
<style>
body{font-family:Arial; background:#111; color:white; text-align:center; padding:10px}
.tool{background:#222; padding:15px; margin:12px 0; border-radius:12px; border:1px solid #333}
button{background:#00ff88; border:none; padding:10px 15px; margin:5px; border-radius:8px; font-weight:bold; cursor:pointer}
input{padding:8px}
canvas{max-width:95%; margin-top:10px; border-radius:8px; background:white}
#download{background:#0088ff; color:white; display:inline-block; margin-top:10px; text-decoration:none; padding:10px 20px; border-radius:8px}
</style>
</head>
<body>
<h1>ToolPixel - 7 Tools (No Internet Needed)</h1>
<p>Speed 196B/s par bhi chalega</p>

<div class="tool">
<input type="file" id="upload" accept="image/*">
<br><canvas id="canvas"></canvas>
<br><a id="download" download="toolpixel.png">⬇️ Download Karo</a>
</div>

<div class="tool">
<h3>7 Tools</h3>
<button onclick="removeBg()">1. Background Remove</button>
<button onclick="compress()">2. Compress (Chota Karo)</button>
<button onclick="resize()">3. Resize (500px)</button>
<button onclick="grayscale()">4. Black & White</button>
<button onclick="rotate()">5. Rotate</button>
<button onclick="bright()">6. Brightness +</button>
<button onclick="invert()">7. Negative Effect</button>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let img=new Image(), angle=0;

document.getElementById('upload').addEventListener('change', e=>{
  let file=e.target.files[0];
  let r=new FileReader();
  r.onload=ev=>{
    img.onload=()=>{
      canvas.width=img.width; canvas.height=img.height;
      ctx.drawImage(img,0,0);
      updateDown();
    }
    img.src=ev.target.result;
  }
  r.readAsDataURL(file);
});

function updateDown(){ document.getElementById('download').href=canvas.toDataURL(); }

function removeBg(){
  let d=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<d.data.length;i+=4){
    if(d.data[i]>200 && d.data[i+1]>200 && d.data[i+2]>200) d.data[i+3]=0;
  }
  ctx.putImageData(d,0,0); updateDown();
}
function compress(){
  let c=document.createElement('canvas');
  c.width=canvas.width*0.6; c.height=canvas.height*0.6;
  c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);
  canvas.width=c.width; canvas.height=c.height;
  ctx.drawImage(c,0,0); updateDown();
}
function resize(){
  canvas.width=500; canvas.height=500;
  ctx.drawImage(img,0,0,500,500); updateDown();
}
function grayscale(){
  let d=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<d.data.length;i+=4){
    let avg=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
    d.data[i]=d.data[i+1]=d.data[i+2]=avg;
  }
  ctx.putImageData(d,0,0); updateDown();
}
function rotate(){
  angle+=90;
  let c=document.createElement('canvas');
  c.width=canvas.height; c.height=canvas.width;
  let x=c.getContext('2d');
  x.translate(c.width/2,c.height/2); x.rotate(angle*Math.PI/180);
  x.drawImage(canvas,-canvas.width/2,-canvas.height/2);
  canvas.width=c.width; canvas.height=c.height;
  ctx.drawImage(c,0,0); updateDown();
}
function bright(){
  let d=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<d.data.length;i+=4){ d.data[i]+=30; d.data[i+1]+=30; d.data[i+2]+=30; }
  ctx.putImageData(d,0,0); updateDown();
}
function invert(){
  let d=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<d.data.length;i+=4){ d.data[i]=255-d.data[i]; d.data[i+1]=255-d.data[i+1]; d.data[i+2]=255-d.data[i+2]; }
  ctx.putImageData(d,0,0); updateDown();
}
</script>
</body>
</html>
