
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolPixel - All 7 Working</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:10px}
h1{color:#00ff88}
canvas{max-width:95%;background:repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 20px 20px;margin:15px auto;display:block;border-radius:10px;min-height:200px}
button{background:#00ff88;color:#000;border:none;padding:12px;margin:5px;border-radius:8px;font-weight:bold;cursor:pointer}
button:active{background:#fff}
#download{background:#0088ff;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;display:inline-block;margin:10px}
</style>
</head>
<body>
<h1>ToolPixel - 7 Tools Full Color Working</h1>
<input type="file" id="upload" accept="image/*"><br>
<canvas id="canvas"></canvas><br>
<button onclick="removeBG()">1. Background Remove</button>
<button onclick="bw()">2. Black & White</button>
<button onclick="compress()">3. Compress</button>
<button onclick="resize500()">4. Resize 500</button>
<button onclick="bright()">5. Bright</button>
<button onclick="negative()">6. Negative</button>
<button onclick="rotate()">7. Rotate</button>
<br>
<a id="download" download="result.png">⬇️ Download PNG</a>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let original = new Image();
let loaded = false;

document.getElementById('upload').addEventListener('change', function(e){
 let file = e.target.files[0];
 if(!file) return;
 let reader = new FileReader();
 reader.onload = function(ev){
  original.onload = function(){
   canvas.width = original.width;
   canvas.height = original.height;
   ctx.clearRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(original,0,0);
   loaded = true;
   update();
  }
  original.src = ev.target.result;
 }
 reader.readAsDataURL(file);
});

function update(){
 document.getElementById('download').href = canvas.toDataURL("image/png");
}
function need(){ if(!loaded){ alert("Pehle image upload karo"); return false;} return true; }

// REAL WORKING BACKGROUND REMOVE - koi bahar ka AI nahi, 100% offline
function removeBG(){
 if(!need()) return;
 let imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
 let data = imgData.data;
 // top-left pixel ka color background samjho
 let r0=data[0], g0=data[1], b0=data[2];
 for(let i=0;i<data.length;i+=4){
  let dr = Math.abs(data[i]-r0);
  let dg = Math.abs(data[i+1]-g0);
  let db = Math.abs(data[i+2]-b0);
  // agar background color se milta julta hai to transparent kardo
  if(dr<40 && dg<40 && db<40){
   data[i+3]=0;
  }
 }
 ctx.putImageData(imgData,0,0);
 update();
}
function bw(){ if(!need())return; let d=ctx.getImageData(0,0,canvas.width,canvas.height); for(let i=0;i<d.data.length;i+=4){ let g=(d.data[i]+d.data[i+1]+d.data[i+2])/3; d.data[i]=d.data[i+1]=d.data[i+2]=g;} ctx.putImageData(d,0,0); update();}
function compress(){ if(!need())return; let t=document.createElement('canvas'); t.width=canvas.width*0.6; t.height=canvas.height*0.6; t.getContext('2d').drawImage(canvas,0,0,t.width,t.height); canvas.width=t.width; canvas.height=t.height; ctx.drawImage(t,0,0); update();}
function resize500(){ if(!need())return; let t=document.createElement('canvas'); t.width=500; t.height=500; t.getContext('2d').drawImage(canvas,0,0,500,500); canvas.width=500; canvas.height=500; ctx.drawImage(t,0,0); update();}
function bright(){ if(!need())return; let d=ctx.getImageData(0,0,canvas.width,canvas.height); for(let i=0;i<d.data.length;i+=4){ d.data[i]+=35; d.data[i+1]+=35; d.data[i+2]+=35;} ctx.putImageData(d,0,0); update();}
function negative(){ if(!need())return; let d=ctx.getImageData(0,0,canvas.width,canvas.height); for(let i=0;i<d.data.length;i+=4){ d.data[i]=255-d.data[i]; d.data[i+1]=255-d.data[i+1]; d.data[i+2]=255-d.data[i+2];} ctx.putImageData(d,0,0); update();}
function rotate(){ if(!need())return; let t=document.createElement('canvas'); t.width=canvas.height; t.height=canvas.width; let c=t.getContext('2d'); c.translate(t.width/2,t.height/2); c.rotate(90*Math.PI/180); c.drawImage(canvas,-canvas.width/2,-canvas.height/2); canvas.width=t.width; canvas.height=t.height; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(t,0,0); update();}
</script>
</body>
</html>
